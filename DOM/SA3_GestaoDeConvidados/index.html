<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA3 - Gestão de Convidados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho da página -->
    <div class="topo">
        <h1>Credenciamento de Evento</h1>
        <button id="toggleDark">Modo Escuro</button>
    </div>

    <div class="container">

        <!-- Área do formulário -->
        <div class="formulario">
            <h2>Cadastro de Convidados</h2>

            <form id="formCadastro">
                <!-- Os 5 campos obrigatórios -->
                <input type="text" id="nome" placeholder="Nome" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="tel" id="telefone" placeholder="Telefone" required>
                <input type="text" id="empresa" placeholder="Empresa" required>
                <input type="text" id="cargo" placeholder="Cargo" required>

                <button type="submit">Enviar</button>
            </form>

            <!-- Lugar onde a mensagem de erro aparecerá -->
            <div id="mensagemErro"></div>
        </div>

        <!-- Área da lista de convidados -->
        <div class="lista">
            <h2>Lista de Confirmados</h2>

            <div id="listaConvidados"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
